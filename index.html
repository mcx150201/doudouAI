'## 十一、关于 Cookie 与本地存储',

function d5(){const c=$('#c5').getContext('2d');c.clearRect(0,0,300,300);c.strokeStyle='#8a8f9c66';for(let i=0;i<15;i++){c.beginPath();c.moveTo(10+i*20,10);c.lineTo(10+i*20,290);c.moveTo(10,10+i*20);c.lineTo(290,10+i*20);c.stroke()}g5.b.forEach((v,i)=>{if(!v)return;c.beginPath();c.arc(10+(i%15)*20,10+(i/15|0)*20,8,0,7);c.fillStyle=v==1?'#111':'#fff';c.fill();c.strokeStyle='#888';c.stroke()})}

const ok5=(a,b)=>a>=0&&b>=0&&a<15&&b<15,D5=[[1,0],[0,1],[1,1],[1,-1]];

function ev5(x,y,p){let t=0;for(const[dx,dy]of D5){let n=1,o=0;for(const s of[1,-1]){let a=x+dx*s,b=y+dy*s;while(ok5(a,b)&&g5.b[b*15+a]==p){n++;a+=dx*s;b+=dy*s}if(ok5(a,b)&&!g5.b[b*15+a])o++}t+=n>=5?1e6:o==0?0:[0,1,10,100,1000][n]*(o==2?3:1)}return t}

const pxCode=()=>`export default {
  async fetch(req) {
    const ALLOW_ORIGIN = "${location.protocol.startsWith('http')?location.origin:'https://你的网站地址'}";
    const cors = {"Access-Control-Allow-Origin": ALLOW_ORIGIN, "Access-Control-Allow-Headers": "*", "Access-Control-Allow-Methods": "GET,POST,OPTIONS", "Vary": "Origin"};
    if (req.method === "OPTIONS") return new Response(null, {headers: cors});
    if (req.headers.get("Origin") !== ALLOW_ORIGIN) return new Response("forbidden", {status: 403});
    const u = new URL(req.url);
    const t = req.url.slice(u.origin.length + 1).replace(/^(https?):\\/(?!\\/)/, "$1://");
    let target; try { target = new URL(t); } catch { return new Response("bad url", {status: 400, headers: cors}); }
    const h = new Headers(req.headers); h.delete("origin"); h.delete("referer");
    const r = await fetch(target, {method: req.method, headers: h, body: ["GET","HEAD"].includes(req.method) ? undefined : req.body});
    const rh = new Headers(r.headers); Object.entries(cors).forEach(([k, v]) => rh.set(k, v));
    return new Response(r.body, {status: r.status, headers: rh});
  }
}`;
